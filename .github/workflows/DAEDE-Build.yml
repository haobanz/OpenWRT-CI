# SPDX-License-Identifier: MIT

name: NN6000 Self-Maintained Firmware

on:
  # Check the firmware source and cloudflared feed every six hours.
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/DAEDE-Build.yml'
      - 'Config/NN6000-DAEDE.txt'
      - 'Config/GENERAL-NN6000-DAEDE.txt'
      - 'Scripts/Build-NN6000-DAEDE.sh'
      - 'Scripts/Packages-NN6000-DAEDE.sh'
      - 'vendor/cloudflare-tunnel-manager/**'
      - 'vendor/game-accelerators/**'
      - 'tools/biubiu-lab/**'

permissions:
  contents: write

concurrency:
  # Include the ref so a stale run on one branch cannot block another build.
  group: daede-nn6000-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check firmware and cloudflared upstream
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      upstream_sha: ${{ steps.compare.outputs.upstream_sha }}
      cloudflared_sha: ${{ steps.compare.outputs.cloudflared_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compare upstream revision
        id: compare
        env:
          FORCE_BUILD: ${{ github.event_name != 'schedule' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          upstream_sha="$(git ls-remote https://github.com/VIKINGYFY/immortalwrt.git refs/heads/main | awk 'NR == 1 { print $1 }')"
          [[ -n "$upstream_sha" ]]
          cloudflared_sha="$(
            curl -fsSL --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              'https://api.github.com/repos/immortalwrt/packages/commits?sha=master&path=net/cloudflared&per_page=1' \
              | jq -er '.[0].sha'
          )"
          known_sha=""
          known_cloudflared_sha=""
          state_ref=HEAD
          if [[ "$FORCE_BUILD" != true ]]; then
            # A scheduled run may have waited behind a push build. Read the
            # baseline committed by that build instead of the stale event SHA.
            git fetch --no-tags origin \
              '+refs/heads/main:refs/remotes/origin/main'
            state_ref=origin/main
          fi
          if git cat-file -e \
              "${state_ref}:.github/daede-state/immortalwrt-main.sha" 2>/dev/null; then
            known_sha="$(git show "${state_ref}:.github/daede-state/immortalwrt-main.sha" | tr -d '[:space:]')"
          fi
          if git cat-file -e \
              "${state_ref}:.github/daede-state/cloudflared.sha" 2>/dev/null; then
            known_cloudflared_sha="$(git show "${state_ref}:.github/daede-state/cloudflared.sha" | tr -d '[:space:]')"
          fi

          changed=false
          if [[ "$FORCE_BUILD" == true || "$upstream_sha" != "$known_sha" || \
                "$cloudflared_sha" != "$known_cloudflared_sha" ]]; then
            changed=true
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "cloudflared_sha=$cloudflared_sha" >> "$GITHUB_OUTPUT"
          {
            echo "### Upstream check"
            echo "- ImmortalWrt: `$upstream_sha`"
            echo "- Last firmware build: `${known_sha:-none}`"
            echo "- cloudflared feed: `$cloudflared_sha`"
            echo "- Last cloudflared build: `${known_cloudflared_sha:-none}`"
            echo "- Build required: `$changed`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build NN6000 v2 firmware and integrated services
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout DAEDE project
        uses: actions/checkout@v4

      - name: Checkout ImmortalWrt source
        uses: actions/checkout@v4
        with:
          repository: VIKINGYFY/immortalwrt
          ref: main
          path: immortalwrt-local
          fetch-depth: 1

      - name: Restore build cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            immortalwrt-local/dl
            immortalwrt-local/.ccache
            immortalwrt-local/staging_dir/host*
            immortalwrt-local/staging_dir/tool*
            immortalwrt-local/build_dir/host*
            immortalwrt-local/build_dir/tool*
          key: daede-nn6000-${{ runner.os }}-${{ needs.check.outputs.upstream_sha }}-${{ needs.check.outputs.cloudflared_sha }}-${{ hashFiles('Config/NN6000-DAEDE.txt', 'Config/GENERAL-NN6000-DAEDE.txt', 'vendor/daede/REVISION', 'vendor/daede/vmlinux-btf/Makefile', 'vendor/agent-hub/**', 'vendor/cloudflare-tunnel-manager/**', 'vendor/game-accelerators/**') }}
          restore-keys: |
            daede-nn6000-${{ runner.os }}-

      - name: Initialize build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update
          sudo -E apt-get install -y dos2unix libfuse-dev python3-cryptography \
            libcurl4-openssl-dev libjson-c-dev libssl-dev
          sudo bash -c 'bash <(curl -fsSL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E apt-get install -y dwarves
          command -v pahole
          pahole --version
          sudo -E timedatectl set-timezone Asia/Shanghai || true

      - name: Test clean-room protocol codecs
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -Eeuo pipefail
          python3 -B -m unittest discover \
            -s tools/biubiu-lab -p 'test_biubiu_*.py' -v
          cc -std=c11 -Wall -Wextra -Wformat=2 -Werror \
            -o "$RUNNER_TEMP/biubiu-accctl-host" \
            vendor/game-accelerators/biubiu-acc/src/biubiu-accctl.c \
            $(pkg-config --cflags --libs libcurl json-c openssl)
          "$RUNNER_TEMP/biubiu-accctl-host" self-test

      - name: Record build revision
        run: |
          echo "UPSTREAM_SHA=$(git -C immortalwrt-local rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_ENV"

      - name: Build firmware and packages
        env:
          SOURCE_DIR: ${{ github.workspace }}/immortalwrt-local
          JOBS: 8
          SKIP_FEEDS: 0
        run: bash Scripts/Build-NN6000-DAEDE.sh

      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            immortalwrt-local/dl
            immortalwrt-local/.ccache
            immortalwrt-local/staging_dir/host*
            immortalwrt-local/staging_dir/tool*
            immortalwrt-local/build_dir/host*
            immortalwrt-local/build_dir/tool*
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Collect release files
        shell: bash
        run: |
          set -Eeuo pipefail
          target_dir="immortalwrt-local/bin/targets/qualcommax/ipq60xx"
          upload_dir="upload"
          mkdir -p "$upload_dir"

          sysupgrade="$(find "$target_dir" -maxdepth 1 -type f -name '*link_nn6000-v2*squashfs-sysupgrade.bin' -print -quit)"
          factory="$(find "$target_dir" -maxdepth 1 -type f -name '*link_nn6000-v2*squashfs-factory.bin' -print -quit)"
          manifest="$(find "$target_dir" -maxdepth 1 -type f -name '*.manifest' -print -quit)"
          [[ -n "$sysupgrade" && -n "$factory" ]]
          [[ -n "$manifest" ]]
          grep -q '^luci-app-openclash ' "$manifest"
          grep -q '^cloudflared ' "$manifest"
          grep -q '^cloudflare-tunnel-manager ' "$manifest"
          grep -q '^luci-app-cloudflare-tunnel-manager ' "$manifest"
          grep -q '^luci-app-uugamebooster ' "$manifest"
          grep -q '^leigod-acc ' "$manifest"
          grep -q '^luci-app-leigod-acc ' "$manifest"
          grep -q '^luci-i18n-leigod-acc-zh-cn ' "$manifest"
          grep -q '^biubiu-acc ' "$manifest"
          grep -q '^luci-app-biubiu-acc ' "$manifest"
          cp -f "$sysupgrade" "$factory" "$upload_dir/"

          find immortalwrt-local/bin -type f \( \
            -name 'dae-*.apk' -o \
            -name 'daed-*.apk' -o \
            -name 'luci-app-daede-*.apk' -o \
            -name 'vmlinux-btf-*.apk' -o \
            -name 'kmod-sched-bpf-*.apk' -o \
            -name 'kmod-xdp-sockets-diag-*.apk' -o \
            -name 'luci-app-openclash-*.apk' -o \
            -name 'cloudflared-*.apk' -o \
            -name 'cloudflare-tunnel-manager-*.apk' -o \
            -name 'luci-app-cloudflare-tunnel-manager-*.apk' -o \
            -name 'luci-app-uugamebooster-*.apk' -o \
            -name 'leigod-acc-*.apk' -o \
            -name 'luci-app-leigod-acc-*.apk' -o \
            -name 'luci-i18n-leigod-acc-zh-cn-*.apk' -o \
            -name 'biubiu-acc-*.apk' -o \
            -name 'luci-app-biubiu-acc-*.apk' -o \
            -name 'picoclaw-*.apk' -o \
            -name 'nullclaw-*.apk' -o \
            -name 'zeroclaw-*.apk' -o \
            -name 'agent-hub-*.apk' -o \
            -name 'luci-app-agent-hub-*.apk' \
          \) -exec cp -f {} "$upload_dir/" \;

          for pattern in 'dae-*.apk' 'daed-*.apk' 'luci-app-daede-*.apk' \
            'vmlinux-btf-*.apk' 'kmod-sched-bpf-*.apk' 'kmod-xdp-sockets-diag-*.apk' \
            'luci-app-openclash-*.apk' \
            'cloudflared-*.apk' 'cloudflare-tunnel-manager-*.apk' \
            'luci-app-cloudflare-tunnel-manager-*.apk' \
            'luci-app-uugamebooster-*.apk' 'leigod-acc-*.apk' \
            'luci-app-leigod-acc-*.apk' 'luci-i18n-leigod-acc-zh-cn-*.apk' \
            'biubiu-acc-*.apk' 'luci-app-biubiu-acc-*.apk' \
            'picoclaw-*.apk' 'nullclaw-*.apk' 'zeroclaw-*.apk' 'agent-hub-*.apk' \
            'luci-app-agent-hub-*.apk'; do
            if ! compgen -G "$upload_dir/$pattern" > /dev/null; then
              echo "Missing release package: $pattern" >&2
              exit 1
            fi
          done

          find "$target_dir" -maxdepth 1 -type f -name '*.manifest' \
            -exec cp -f {} "$upload_dir/" \;
          cp -f build/NN6000-DAEDE.config "$upload_dir/NN6000-DAEDE.config"
          cp -f vendor/daede/REVISION "$upload_dir/DAEDE-REVISION"
          cp -f vendor/agent-hub/REVISION "$upload_dir/AGENT-HUB-REVISION"
          cp -f vendor/cloudflare-tunnel-manager/REVISION \
            "$upload_dir/CLOUDFLARE-TUNNEL-MANAGER-REVISION"
          cp -f vendor/game-accelerators/REVISION \
            "$upload_dir/GAME-ACCELERATORS-REVISION"

          (
            cd "$upload_dir"
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
              | sort -z | xargs -0 sha256sum > SHA256SUMS
          )

          duplicate_names="$(
            find "$upload_dir" -maxdepth 1 -type f -printf '%f\n' \
              | awk '{ name = tolower($0); if (++seen[name] == 2) print name }'
          )"
          if [[ -n "$duplicate_names" ]]; then
            echo "Release asset names collide when compared case-insensitively:" >&2
            echo "$duplicate_names" >&2
            exit 1
          fi
          ls -lh "$upload_dir"

      - name: Publish self-maintained firmware release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          tag="DAEDE-NN6000-v2-${BUILD_DATE}-${UPSTREAM_SHA}"
          title="DAEDE NN6000 v2 ${BUILD_DATE}"
          notes="$RUNNER_TEMP/daede-release-notes.md"

          cat > "$notes" <<EOF
            自维护 DAEDE NN6000 v2 固件。

            目标：Link NN6000 v2 / qualcommax-ipq60xx
            ImmortalWrt 提交：${UPSTREAM_SHA}
            daed/dae 版本：见仓库中的 vendor/daede/REVISION

            内容：OpenClash、dae、daed、luci-app-daede、匹配内核的
            vmlinux-btf、BPF/XDP 内核模块，以及 Agent Hub 管理的 PicoClaw、
            NullClaw、ZeroClaw。三个 Agent 运行时同时安装，但只启动所选的一个；
            LuCI 提供统一聊天控制台和三运行时通用 Telegram 机器人设置，以及
            默认关闭的可选 Root 系统权限；配置应用后会重启所选运行时，确保渠道
            和权限立即生效。固件还包含 PicoClaw Launcher 与 ZeroClaw Dashboard。

            Cloudflare Tunnel 管理器支持多 CF 账号、0600 权限隔离 Token 文件、多
            cloudflared 实例、LAN DHCP 设备与端口选择、Ingress 和 DNS 原子同步、
            资源占用及日志。cloudflared 核心来自 ImmortalWrt packages feed，管理
            后端与 LuCI 界面由本仓库维护。

            网易 UU 与雷神加速器均已集成，默认关闭且互斥运行。UU 核心在启动时
            通过厂商 HTTPS 接口获取；雷神仅启用 firewall4 兼容的 TUN 模式，核心
            首次启动下载并校验固定 SHA-256。固件使用 nftables 版 UPnP，并同时
            发布四个自维护插件 APK（含雷神中文语言包）。使用前应让
            OpenClash/dae 绕过加速设备。

            固件预装实验性的 biubiu-acc 与 LuCI 页面，Release 也附带两个独立
            APK。它是本仓库的独立实现，当前
            已完成二维码协议，并实现短信验证码和隐藏输入密码登录；手机登录的
            真实会话及安全续期已经账号本人授权验证。0.7.1 已将稳定设备 ID、
            root 私有会话存储、脱敏状态查询和原子续期移植到 OpenWrt C 客户端，
            并包含加速业务独立 key/IV 的 ADAT 离线编解码、外部 RSA 公钥导入、
            0600 缓存和脱敏指纹状态；不内置受保护的引导公钥。LuCI 支持短信
            登录、整个 LAN 或指定设备作用域、Steam/CS2/Epic 内置选择、配置预检、
            自检、日志和只读实时匹配观测，原始 ID 收入高级设置，procd 管理进程
            默认关闭。Bolt v3 帧编解码已进入 C 自检；控制 API、数据通道与游戏
            特征流量路由仍在验证，因此不会显示虚假的加速状态，也不会接管流量。

            普通升级使用 squashfs-sysupgrade.bin；factory.bin 仅用于初始
            刷写或恢复。APK 包只适用于同一目标和同一内核版本。
          EOF

          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" \
              --title "$title" \
              --target "$GITHUB_SHA" \
              --notes-file "$notes" \
              --draft
          else
            gh release create "$tag" \
              --title "$title" \
              --target "$GITHUB_SHA" \
              --notes-file "$notes" \
              --draft
          fi

          upload_asset() {
            local asset="$1"
            local attempt
            for attempt in 1 2 3 4; do
              if gh release upload "$tag" "$asset" --clobber; then
                return 0
              fi
              if (( attempt == 4 )); then
                echo "Failed to upload $asset after $attempt attempts" >&2
                return 1
              fi
              echo "Upload failed for $asset; retrying ($attempt/4)" >&2
              sleep "$((attempt * 15))"
            done
          }

          while IFS= read -r -d '' asset; do
            upload_asset "$asset"
          done < <(
            find upload -maxdepth 1 -type f ! -name '*squashfs-*.bin' -print0 | sort -z
          )

          while IFS= read -r -d '' asset; do
            upload_asset "$asset"
          done < <(
            find upload -maxdepth 1 -type f -name '*squashfs-*.bin' -print0 | sort -z
          )

          gh release edit "$tag" --draft=false

  finalize:
    name: Record successful build
    runs-on: ubuntu-latest
    needs:
      - check
      - build
    if: >-
      always() &&
      needs.check.outputs.changed == 'true' &&
      needs.build.result == 'success'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update build baseline
        env:
          UPSTREAM_SHA: ${{ needs.check.outputs.upstream_sha }}
          CLOUDFLARED_SHA: ${{ needs.check.outputs.cloudflared_sha }}
        run: |
          set -Eeuo pipefail
          mkdir -p .github/daede-state
          printf '%s\n' "$UPSTREAM_SHA" > .github/daede-state/immortalwrt-main.sha
          printf '%s\n' "$CLOUDFLARED_SHA" > .github/daede-state/cloudflared.sha
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/daede-state/immortalwrt-main.sha \
            .github/daede-state/cloudflared.sha
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record successful DAED build"
          git push origin HEAD:main
